  <g>
    <rect x="968" y="288" width="168" height="58" rx="14" fill="#111827" stroke="#F2C811" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="2.4s" repeatCount="indefinite"/>
