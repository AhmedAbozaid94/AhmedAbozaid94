      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="538" cy="317.0" r="5" fill="#22D3EE">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="554" y="314" class="node">Warehouse</text>
    <text x="554" y="333" class="cap" fill="#22D3EE">model</text>
  </g>
  <g>
    <rect x="742" y="288" width="168" height="58" rx="14" fill="#111827" stroke="#2DD4BF" stroke-width="1.5" stroke-opacity="0.35">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite"/>
    </rect>
    <circle cx="764" cy="317.0" r="5" fill="#2DD4BF">
      <animate attributeName="r" values="5;7;5" dur="3s" begin="1.7999999999999998s" repeatCount="indefinite"/>
    </circle>
    <text x="780" y="314" class="node">Airflow</text>
    <text x="780" y="333" class="cap" fill="#2DD4BF">orchestrate</text>
